<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=visibility,visibility_off"
    />
    <title>Zvon</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: sans-serif;
      }

      /* UI Overlay Button Styling */
      #ui-container {
        position: absolute;
        bottom: 12px;
        right: 12px;
        z-index: 100;
      }

      .toggle-btn {
        background: #ffffff;
        color: #111111;
        border: 1px solid #cccccc;
        padding: 10px 10px;
        font-size: 14px;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        transition:
          background 0.2s,
          transform 0.1s;
      }

      .toggle-btn:hover {
        background: #f0f0f0;
      }

      .toggle-btn:active {
        transform: scale(0.97);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        background-color: #1a1a1a;
      }
      #webgl {
        position: fixed;
        top: 0;
        left: 0;
        outline: none;
      }
    </style>
  </head>
  <body>
    <canvas id="webgl"></canvas>
    <script type="module" src="src/main.js"></script>
    <div id="ui-container">
      <button id="toggleBtn" class="toggle-btn">
        <span class="material-symbols-outlined" id="toggleButtonIcon">
          visibility_off
        </span>
      </button>
    </div>
  </body>
</html>
